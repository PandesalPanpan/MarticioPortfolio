<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons are generated by scripts/build-brand-assets.mjs. The SVG carries
         its own prefers-color-scheme rules; iOS ignores SVG favicons, so the
         home-screen icon has to be the PNG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)" />
    <title>Peter Elijah Marticio | Full-Stack Developer</title>
    <meta
      name="description"
      content="Full-stack developer and Computer Engineering student at PUP building production web apps, offline-ready software, inventory systems, and real-time applications."
    />
    <link rel="canonical" href="https://marticio.com/" />
    <meta property="og:title" content="Peter Elijah Marticio | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer and Computer Engineering student at PUP building production web apps, offline-ready software, inventory systems, and real-time applications."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marticio.com/" />
    <meta property="og:site_name" content="Peter Elijah Marticio" />
    <meta property="og:image" content="https://marticio.com/og.png" />
    <meta property="og:image:alt" content="Peter Elijah Marticio, Full-Stack Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peter Elijah Marticio | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer and Computer Engineering student at PUP building production web apps, offline-ready software, inventory systems, and real-time applications."
    />
    <meta name="twitter:image" content="https://marticio.com/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://marticio.com/#person",
            "name": "Peter Elijah Marticio",
            "url": "https://marticio.com/",
            "jobTitle": "Full-Stack Developer",
            "description": "Full-stack developer and Computer Engineering student at PUP building production web apps, offline-ready software, inventory systems, and real-time applications.",
            "affiliation": {
              "@type": "CollegeOrUniversity",
              "name": "Polytechnic University of the Philippines"
            },
            "sameAs": [
              "https://github.com/PandesalPanpan",
              "https://www.linkedin.com/in/peter-elijah-a-marticio-46340125b/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://marticio.com/#website",
            "url": "https://marticio.com/",
            "name": "Peter Elijah Marticio",
            "description": "Portfolio of Peter Elijah Marticio, Full-Stack Developer.",
            "publisher": { "@id": "https://marticio.com/#person" },
            "about": { "@id": "https://marticio.com/#person" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mp-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
